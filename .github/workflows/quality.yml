name: Tests et sécurité

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier la qualité statique
        run: npm run lint

      - name: Vérifier les types JavaScript
        run: npm run typecheck

      - name: Exécuter les tests
        run: npm test

      - name: Auditer les dépendances
        run: npm audit --audit-level=high

      - name: Construire la production
        run: npm run build

      - name: Installer Java pour Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Synchroniser le projet Capacitor Android
        run: npx cap sync android

      - name: Vérifier le client Android
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lint --no-daemon --console=plain

  e2e:
    name: Parcours E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secret_clubhouse_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d secret_clubhouse_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/secret_clubhouse_e2e_test
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: Exécuter les parcours E2E isolés
        run: npm run test:e2e

      - name: Conserver le rapport en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  verify-production:
    name: Vérifier le SHA servi par Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le vérificateur
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Attendre et vérifier le déploiement Render
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if node server/verify-production-deployment.js \
              https://secret-clubhouse.onrender.com "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Render ne sert pas le SHA attendu après dix minutes." >&2
              exit 1
            fi
            sleep 10
          done
