name: Tests et sécurité

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Exécuter les tests
        run: npm test

      - name: Auditer les dépendances
        run: npm audit --audit-level=high

      - name: Construire la production
        run: npm run build

      - name: Installer Java pour Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Synchroniser le projet Capacitor Android
        run: npx cap sync android

      - name: Vérifier le client Android
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lint --no-daemon --console=plain
