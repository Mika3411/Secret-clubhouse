name: Publier sur TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: Archiver et envoyer l’app iOS
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 45
    env:
      APPLE_BUNDLE_ID: fr.secretclubhouse.app
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Vérifier Xcode et les identifiants Apple
        shell: bash
        run: |
          set -euo pipefail

          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          if [[ "$xcode_version" != 26.* ]]; then
            echo "Capacitor 8 exige Xcode 26 ; version trouvée : $xcode_version." >&2
            exit 1
          fi

          missing=()
          for variable in \
            APPLE_TEAM_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_PRIVATE_KEY
          do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Configuration TestFlight manquante : %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Synchroniser et vérifier le projet iOS
        run: npm run mobile:sync:ios

      - name: Préparer la clé App Store Connect
        id: api_key
        shell: bash
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"

          echo "path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Créer l’archive iOS signée
        id: archive
        shell: bash
        env:
          APPSTORE_API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          set -euo pipefail

          build_number="$(date -u +%s)"
          archive_path="$RUNNER_TEMP/SecretClubhouse.xcarchive"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPSTORE_API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=1.14 \
            CURRENT_PROJECT_VERSION="$build_number" \
            clean archive

      - name: Envoyer l’archive vers TestFlight
        shell: bash
        env:
          APPSTORE_API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/SecretClubhouse.xcarchive"
          export_path="$RUNNER_TEMP/SecretClubhouse-export"
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"

          plutil -create xml1 "$export_options_path"
          plutil -insert destination -string upload "$export_options_path"
          plutil -insert method -string app-store-connect "$export_options_path"
          plutil -insert signingStyle -string automatic "$export_options_path"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options_path"
          plutil -insert manageAppVersionAndBuildNumber -bool false "$export_options_path"
          plutil -insert uploadSymbols -bool true "$export_options_path"

          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPSTORE_API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

          echo "Build ${{ steps.archive.outputs.build_number }} envoyé à App Store Connect."

      - name: Supprimer la clé temporaire
        if: always() && steps.api_key.outcome != 'skipped'
        shell: bash
        env:
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          if [[ -n "$API_KEY_PATH" ]]; then
            rm -f "$API_KEY_PATH"
          fi
