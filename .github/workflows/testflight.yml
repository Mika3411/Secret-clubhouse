name: Publier sur TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: Archiver et envoyer l’app iOS
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 45
    env:
      APPLE_BUNDLE_ID: fr.secretclubhouse.app
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Récupérer main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Vérifier Xcode et les identifiants Apple
        shell: bash
        run: |
          set -euo pipefail

          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          if [[ "$xcode_version" != 26.* ]]; then
            echo "Capacitor 8 exige Xcode 26 ; version trouvée : $xcode_version." >&2
            exit 1
          fi

          missing=()
          for variable in \
            APPLE_TEAM_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_PRIVATE_KEY \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_PROVISIONING_PROFILE_BASE64
          do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Configuration TestFlight manquante : %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Synchroniser et vérifier le projet iOS
        run: npm run mobile:sync:ios

      - name: Préparer la clé App Store Connect
        id: api_key
        shell: bash
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"

          echo "path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Vérifier la fiche App Store Connect
        env:
          APPSTORE_API_KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: node scripts/check-app-store-connect.js

      - name: Installer la signature Apple
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/SecretClubhouse-Distribution.p12"
          profile_path="$RUNNER_TEMP/SecretClubhouse.mobileprovision"
          profile_plist_path="$RUNNER_TEMP/SecretClubhouse-profile.plist"
          keychain_path="$RUNNER_TEMP/SecretClubhouse-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" \
            | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep 'Apple Distribution'

          security cms -D -i "$profile_path" > "$profile_plist_path"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist_path")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist_path")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist_path")"
          profile_apns="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:aps-environment' "$profile_plist_path")"

          if [[ "$profile_app_id" != "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID" ]]; then
            echo "Le profil ne correspond pas à $APPLE_BUNDLE_ID." >&2
            exit 1
          fi
          if [[ "$profile_apns" != "production" ]]; then
            echo "Le profil App Store doit activer APNs en production." >&2
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"

      - name: Créer l’archive iOS signée
        id: archive
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail

          build_number="$(date -u +%s)"
          archive_path="$RUNNER_TEMP/SecretClubhouse.xcarchive"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION=1.15 \
            CURRENT_PROJECT_VERSION="$build_number" \
            clean archive

      - name: Envoyer l’archive vers TestFlight
        shell: bash
        env:
          APPSTORE_API_KEY_PATH: ${{ steps.api_key.outputs.path }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/SecretClubhouse.xcarchive"
          export_path="$RUNNER_TEMP/SecretClubhouse-export"
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"

          plutil -create xml1 "$export_options_path"
          plutil -insert destination -string upload "$export_options_path"
          plutil -insert method -string app-store-connect "$export_options_path"
          plutil -insert signingStyle -string manual "$export_options_path"
          plutil -insert signingCertificate -string "Apple Distribution" "$export_options_path"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options_path"
          plutil -insert manageAppVersionAndBuildNumber -bool false "$export_options_path"
          plutil -insert uploadSymbols -bool true "$export_options_path"
          /usr/libexec/PlistBuddy \
            -c 'Add :provisioningProfiles dict' \
            "$export_options_path"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:$APPLE_BUNDLE_ID string $PROFILE_NAME" \
            "$export_options_path"

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options_path" \
            -authenticationKeyPath "$APPSTORE_API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          export_status=$?
          set -e

          if (( export_status != 0 )); then
            echo "::group::Diagnostic de distribution Xcode"
            while IFS= read -r distribution_log; do
              echo "Journal : $(basename "$distribution_log")"
              grep -Eai \
                'error|failure|failed|provision|certificate|profile|authentication|authorization|permission|agreement|App Store Connect' \
                "$distribution_log" \
                | sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1***/g' \
                || true
            done < <(
              find "${TMPDIR:-/tmp}" \
                -type f \
                -path '*.xcdistributionlogs/*' \
                -name '*.log' \
                -print
            )
            echo "::endgroup::"
            exit "$export_status"
          fi

          echo "Build ${{ steps.archive.outputs.build_number }} envoyé à App Store Connect."

      - name: Supprimer les éléments de signature temporaires
        if: always()
        shell: bash
        env:
          API_KEY_PATH: ${{ steps.api_key.outputs.path }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          if [[ -n "$API_KEY_PATH" ]]; then
            rm -f "$API_KEY_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/SecretClubhouse-Distribution.p12" \
            "$RUNNER_TEMP/SecretClubhouse.mobileprovision" \
            "$RUNNER_TEMP/SecretClubhouse-profile.plist"
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ -n "$KEYCHAIN_PATH" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
